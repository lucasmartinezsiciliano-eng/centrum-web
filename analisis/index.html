<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Test anónimo de opciones hipotecarias · Centrum</title><meta name="description" content="Cuatro preguntas, 60 segundos, sin dejar tu nombre ni tu teléfono. Descubre qué salidas tiene tu hipoteca. Anónimo, sin llamada."/><meta property="og:title" content="Test anónimo · Centrum de la Vivienda"/><meta property="og:description" content="En 60 segundos y sin dejar datos, descubre las salidas de tu hipoteca."/><style>
:root{--navy:#18316C;--verde:#3B7F4C;--crema:#EFE8DA;--bg:#12161f;--card:#1c2330;--tx:#eceef2;--mut:#98a0b3;--ok:#7fc98f;--warn:#e8c268;--no:#8b93a7}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:17px/1.5 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px;width:100%;flex:1;display:flex;flex-direction:column}
.brand{font-weight:700;letter-spacing:.24em;color:var(--crema);font-size:15px;margin-bottom:6px}
.step{color:var(--mut);font-size:13px;margin-bottom:18px;min-height:16px}
h1{font-size:26px;line-height:1.2;margin-bottom:10px}
h2{font-size:22px;line-height:1.25;margin-bottom:6px}
.sub{color:var(--mut);font-size:15px;margin-bottom:22px}
.norm{color:var(--mut);font-size:13.5px;margin-bottom:14px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:auto;margin-bottom:8px}
.opt{background:var(--card);border:1px solid #2a3446;border-radius:14px;padding:16px 16px;font-size:16.5px;cursor:pointer;text-align:left;color:var(--tx);width:100%}
.opt:active,.opt.sel{border-color:var(--verde);background:#213127}
.btn{background:var(--verde);color:#fff;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;width:100%}
.btn2{background:transparent;color:var(--mut);border:1px solid #2a3446;border-radius:14px;padding:13px;font-size:15px;cursor:pointer;width:100%}
.back{background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer;padding:8px 0;text-align:left;min-height:36px}
.hide{display:none}
.feat{display:flex;flex-direction:column;gap:8px;margin:18px 0 26px}
.feat div{color:var(--crema);font-size:15px}
.check{color:var(--mut);font-size:15px;margin:8px 0}
.mapa{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.via{background:var(--card);border-radius:12px;padding:12px 14px}
.via b{font-size:15.5px}.via p{color:var(--mut);font-size:13.5px;margin-top:3px}
.via.ok{border-left:3px solid var(--ok)}.via.warn{border-left:3px solid var(--warn)}.via.no{border-left:3px solid #39415a;opacity:.75}
.urg{background:#2a2416;border:1px solid #4a3f1e;border-radius:12px;padding:12px 14px;font-size:14px;color:#e8d9a8;margin:6px 0 14px}
.leg{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.5}
.wanote{color:var(--mut);font-size:13.5px;margin:10px 0 16px;text-align:center}
.eco{background:#1a2b3d00;border:1px dashed #2a3446;border-radius:12px;padding:10px 14px;color:var(--mut);font-size:14px;margin-bottom:12px}
footer{color:#5a6275;font-size:11.5px;text-align:center;padding:14px}
</style></head><body><div class="wrap" id="app"></div>
<footer>Centrum · Test orientativo y anónimo · No es asesoramiento individualizado</footer>
<script>
var WA="34669959755";
var S={p:0,r:{}};
var PREGS=[
 {k:"vivienda",t:"¿La hipoteca es de tu vivienda habitual?",n:"",o:[["habitual","Sí, es donde vivo"],["no","No, es otra vivienda"],["familiar","Es de un familiar (yo avalo)"]]},
 {k:"pagos",t:"¿Cómo están los pagos ahora mismo?",n:"La mayoría de quienes hacen este test lleva entre 2 y 8 cuotas sin pagar.",o:[["al_dia","Al día, pero me cuesta"],["c12","1–2 cuotas sin pagar"],["c36","3–6 cuotas"],["c6m","Más de 6 cuotas"]]},
 {k:"recibido",t:"¿Qué has recibido del banco o del juzgado?",n:"",o:[["nada","Nada todavía"],["cartas","Cartas de reclamación"],["demanda","Una demanda"],["subasta","Fecha de subasta"],["nose","No estoy seguro"]]},
 {k:"aval",t:"¿Hay avalistas en la hipoteca?",n:"",o:[["familiar","Sí, un familiar me avala"],["yo","Yo avalo a otra persona"],["no","No"],["nose","No lo sé"]]},
 {k:"ingresos",t:"¿Tu situación de ingresos hoy?",n:"",o:[["estable","Trabajo estable"],["temporal","Trabajo temporal o irregular"],["paro","Paro o subsidio"],["pension","Pensión"],["sin","Sin ingresos ahora"]]}
];
function el(h){document.getElementById("app").innerHTML=h;window.scrollTo(0,0);}
function esc(s){return String(s).replace(/</g,"&lt;");}
function portada(){
 el('<div class="brand">CENTRUM</div><div class="step"></div>'+
 '<h1>Test anónimo de opciones hipotecarias</h1>'+
 '<p class="sub">Descubre en 60 segundos qué salidas tiene un caso como el tuyo.</p>'+
 '<div class="feat"><div>✓ Sin nombre</div><div>✓ Sin teléfono</div><div>✓ Sin llamadas</div><div>✓ 5 preguntas, solo tocar</div></div>'+
 '<div class="opts"><button class="btn" onclick="q(0)">Empezar</button></div>'+
 '<p class="leg">Tus respuestas no salen de tu móvil salvo que tú decidas continuar por WhatsApp. Sin cookies, sin rastreo.</p>');
}
function q(i){
 S.p=i;var P=PREGS[i];var h='<div class="brand">CENTRUM</div><div class="step">'+(i+1)+' de 5</div>';
 h+='<h2>'+P.t+'</h2>';if(P.n)h+='<p class="norm">'+P.n+'</p>';
 h+='<div class="opts">';
 for(var j=0;j<P.o.length;j++){h+='<button class="opt" onclick="pick('+i+','+j+',this)">'+P.o[j][1]+'</button>';}
 h+='</div><button class="back" onclick="'+(i===0?'portada()':'q('+(i-1)+')')+'">← Atrás</button>';
 el(h);
}
function pick(i,j,btn){
 btn.className="opt sel";S.r[PREGS[i].k]=PREGS[i].o[j][0];
 setTimeout(function(){ if(i<4) q(i+1); else inter(); },280);
}
function inter(){
 el('<div class="brand">CENTRUM</div><div class="step"></div><h2>Preparando tu mapa…</h2>'+
 '<div id="chk"></div>');
 var lines=["Comprobando requisitos del Código de Buenas Prácticas…","Midiendo el margen procesal con lo que has contado…","Cruzando tu situación con las siete salidas…"];
 var d=document.getElementById("chk"),k=0;
 var t=setInterval(function(){ if(k<lines.length){d.innerHTML+='<p class="check">· '+lines[k]+'</p>';k++;} else {clearInterval(t);setTimeout(mapa,500);} },800);
}
function motor(r){
 var v=[];
 function via(cls,nom,por){v.push({c:cls,n:nom,p:por});}
 var sinIng=(r.ingresos==="sin");
 var tarde=(r.recibido==="subasta");
 var hab=(r.vivienda==="habitual");
 // 1 Reestructurar / novación
 if(r.pagos==="al_dia") via("ok","Reestructurar con el banco","Al día y a tiempo: la mejor posición para renegociar cuota o plazo.");
 else if(!sinIng&&!tarde) via("ok","Reestructurar con el banco","Con ingresos, se puede pedir carencia o alargar plazo. Probable.");
 else via("warn","Reestructurar con el banco","Posible, pero depende de poder sostener una cuota ajustada.");
 // 2 CBP
 if(!hab) via("no","Código de Buenas Prácticas","Descartado en tu caso: el CBP protege la vivienda habitual, y dijiste que no lo es.");
 else if(r.ingresos==="estable") via("warn","Código de Buenas Prácticas","Depende del umbral de ingresos: hay que mirarlo con tus números.");
 else via("ok","Código de Buenas Prácticas","Con tu situación de ingresos es muy posible que entres en el umbral. Más del 80% de solicitudes se caen por el expediente, no por el caso.");
 // 3 Reunificación
 via("warn","Reunificar deudas","Solo tiene sentido si además de la hipoteca arrastras tarjetas o préstamos. ¿Es tu caso? Se mira en un minuto.");
 // 4 Dación negociada
 if(tarde) via("warn","Negociar la entrega (dación)","Todavía posible antes del cierre, con plazos encima. Se negocia mejor con margen.");
 else via("warn","Negociar la entrega (dación)","Posible si un día la cuota no da más de sí: entregar cancelando la deuda. No es la primera opción con tu margen.");
 // 5 Venta ordenada
 if(tarde) via("warn","Venta ordenada","Aún se llega, pero cada semana cuenta: vender bien lleva tiempo.");
 else via("ok","Venta ordenada","Siempre posible como elección: vender a precio de mercado y cerrar capítulo con la deuda saldada.");
 // 6 Rehabilitación 693.3
 if(tarde) via("ok","Rehabilitar antes de la subasta","Hasta el cierre de la subasta la ley permite ponerse al día pagando solo las cuotas vencidas. Sin permiso del banco.");
 else if(r.recibido==="demanda") via("warn","Rehabilitar antes de la subasta","Entra en juego si llega a señalarse subasta. Aún no es tu escenario.");
 else via("no","Rehabilitar antes de la subasta","No aplica: no hay subasta.");
 // 7 Concurso
 if(r.pagos==="c6m") via("warn","Concurso (Segunda Oportunidad)","El concurso no borra la hipoteca — pero si arrastras mucha más deuda aparte, lo miramos con un despacho. Y te lo diríamos.");
 else via("no","Concurso (Segunda Oportunidad)","De entrada no: tu problema es la cuota de la casa, y el concurso no la borra. Si tuvieras mucha deuda aparte, lo miraríamos con un despacho.");
 return v;
}
function ecoTxt(r){
 var m={habitual:"vivienda habitual",no:"segunda vivienda",familiar:"avalas a un familiar"};
 var p={al_dia:"pagos al día",c12:"1–2 cuotas sin pagar",c36:"3–6 cuotas sin pagar",c6m:"más de 6 cuotas"};
 var rc={nada:"sin cartas aún",cartas:"cartas recibidas",demanda:"con demanda",subasta:"con fecha de subasta",nose:"sin demanda confirmada"};
 return m[r.vivienda]+" · "+p[r.pagos]+" · "+rc[r.recibido];
}
function urgTxt(r){
 if(r.recibido==="subasta") return "⏰ La rehabilitación se puede pedir hasta el cierre de la subasta. Cada semana cuenta.";
 if(r.recibido==="demanda") return "⏰ Con demanda los plazos procesales corren. Hay vías, pero conviene moverse ya.";
 return "⏰ El Código de Buenas Prácticas se puede pedir hasta el anuncio de subasta — pero cada mes que pasa se cierran opciones, no se abren.";
}
function margen(r){
 if(r.recibido==="subasta") return "Hay una vía específica incluso con fecha puesta.";
 if(r.recibido==="demanda") return "Con demanda todavía hay margen procesal.";
 return "Sin demanda, estás a tiempo de todo: por ley el banco no puede iniciar la ejecución hasta acumular 12 mensualidades.";
}
function mapa(){
 var vias=motor(S.r);var h='<div class="brand">CENTRUM</div><div class="step">Tu mapa</div>';
 h+='<div class="eco">'+ecoTxt(S.r)+'</div>';
 h+='<h2>'+margen(S.r)+'</h2><div class="mapa">';
 for(var i=0;i<vias.length;i++){var x=vias[i];var ic=x.c==="ok"?"✅":(x.c==="warn"?"⚠️":"✖");
  h+='<div class="via '+x.c+'"><b>'+ic+' '+x.n+'</b><p>'+x.p+'</p></div>';}
 h+='</div><div class="urg">'+urgTxt(S.r)+'</div>';
 if(WA){h+='<div class="opts"><button class="btn" onclick="irWA()">Revisar las vías en verde por WhatsApp</button></div>'+
  '<p class="wanote">Te responde una persona, no un bot de ventas. Horario 9–20h. Nadie te va a llamar por teléfono.</p>';}
 h+='<div class="opts"><button class="btn2" onclick="descargar()">Descargar mi mapa (imagen)</button></div>';
 h+='<p class="leg">Orientación general con lo que nos has contado, no un análisis individualizado. Tus respuestas siguen en tu móvil: solo se envían (de forma anónima, con un código de caso) si continúas por WhatsApp.</p>';
 el(h);
}
function irWA(){
 var btnTxt="Hola, vengo del test. ¿Cuál es el siguiente paso?";
 var fu="";try{fu=(new URLSearchParams(location.search).get("f"))||(new URLSearchParams(location.search).get("utm_content"))||"";}catch(e){}
 fetch("https://centrum-crm.lukimporta.es/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({r:S.r,f:fu})})
 .then(function(x){return x.json();}).then(function(j){
   var txt=j&&j.codigo?("Hola, vengo del test. Mi código es "+j.codigo+". ¿Cuál es el siguiente paso?"):btnTxt;
   location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(txt);
 }).catch(function(){location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(btnTxt);});
}
function descargar(){
 var vias=motor(S.r);var c=document.createElement("canvas");c.width=1080;c.height=1500;var g=c.getContext("2d");
 g.fillStyle="#12161f";g.fillRect(0,0,1080,1500);
 g.fillStyle="#EFE8DA";g.font="700 42px system-ui";g.fillText("CENTRUM · Tu mapa de salidas",60,90);
 g.fillStyle="#98a0b3";g.font="28px system-ui";g.fillText(ecoTxt(S.r),60,140);
 var y=210;g.font="600 30px system-ui";
 for(var i=0;i<vias.length;i++){var x=vias[i];
  g.fillStyle=x.c==="ok"?"#7fc98f":(x.c==="warn"?"#e8c268":"#8b93a7");
  g.fillText((x.c==="ok"?"✔ ":(x.c==="warn"?"△ ":"✖ "))+x.n,60,y);y+=42;
  g.fillStyle="#c6ccd8";g.font="24px system-ui";
  var words=x.p.split(" "),line="";
  for(var w=0;w<words.length;w++){if((line+words[w]).length>62){g.fillText(line,90,y);y+=32;line="";}line+=words[w]+" ";}
  g.fillText(line,90,y);y+=52;g.font="600 30px system-ui";}
 g.fillStyle="#e8d9a8";g.font="26px system-ui";
 g.fillText(urgTxt(S.r).replace("⏰ ",""),60,y+10);
 g.fillStyle="#5a6275";g.font="22px system-ui";g.fillText("Test anónimo · orientación general · centrum",60,1450);
 var a=document.createElement("a");a.download="mi-mapa-centrum.png";a.href=c.toDataURL("image/png");a.click();
}
portada();
</script></body></html>
